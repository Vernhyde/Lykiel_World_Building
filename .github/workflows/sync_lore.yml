name: Compile and Sync Lore to Google Drive

on:
  push:
    branches: [ main ]
    paths:
      - '**.md'
      - '!Lykiel_Master.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compile All Markdown Files into Lykiel_Master.md
        run: |
          echo "# LYKIEL MASTER REFERENCE DATABASE" > Lykiel_Master.md
          echo "Last Synced (UTC): $(date -u '+%Y-%m-%d %H:%M:%S')" >> Lykiel_Master.md
          echo "" >> Lykiel_Master.md
          find . -name "*.md" ! -name "Lykiel_Master.md" ! -path "./.*" | sort | while read -r file; do
            echo "" >> Lykiel_Master.md
            echo "================================================================================" >> Lykiel_Master.md
            echo "## FILE SOURCE: ${file#./}" >> Lykiel_Master.md
            echo "================================================================================" >> Lykiel_Master.md
            echo "" >> Lykiel_Master.md
            cat "$file" >> Lykiel_Master.md
            echo "" >> Lykiel_Master.md
          done

      - name: Commit Compiled Master File to GitHub Backup
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Action"
          git add Lykiel_Master.md
          git diff --staged --quiet || git commit -m "Auto-compile Lykiel_Master.md"
          git push

      - name: Set Up Python for Google Drive Sync
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Google API Client
        run: pip install google-api-python-client google-auth

      - name: Overwrite Google Doc Content with Compiled Lore
        env:
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
          GDRIVE_FILE_ID: ${{ secrets.GDRIVE_FILE_ID }}
        run: |
          python3 - << 'EOF'
          import os, json
          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          creds_dict = json.loads(os.environ['GDRIVE_CREDENTIALS'])
          creds = service_account.Credentials.from_service_account_info(
              creds_dict, scopes=['https://www.googleapis.com/auth/drive']
          )
          service = build('drive', 'v3', credentials=creds)
          media = MediaFileUpload('Lykiel_Master.md', mimetype='text/plain', resumable=True)
          service.files().update(fileId=os.environ['GDRIVE_FILE_ID'], media_body=media).execute()
          print("Successfully synced Lykiel_Master.md to Google Drive.")
          EOF
